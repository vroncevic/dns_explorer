name: dns_explorer_interface_checker

permissions:
  contents: read

on:
  push:
    branches: [ dev ]
    paths:
      - 'dns_explorer/**/*.py'
      - 'setup.py'
  pull_request:
    branches: [ dev ]
    paths:
      - 'dns_explorer/**/*.py'
      - 'setup.py'

jobs:
  interface_gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify that each concrete class implements a valid interface
        run: |
          python3 gates/gates/interfaces_checker.py dns_explorer
